<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPATIUM</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#02050d;--p:#0a1a33;--l:#6cc3ff;--w:#e8f4ff;--o:#ff8a3d;--r:#ff4d4d;--g:#4dd68c;--y:#ffd24d}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--w);font-family:'Chakra Petch',system-ui,sans-serif;overflow:hidden}
.scr{position:fixed;inset:0;display:none}.scr.on{display:block}
button{font:inherit;color:var(--w);background:rgba(20,60,110,.45);border:1px solid var(--l);padding:.7em 1.3em;cursor:pointer;transition:.2s}
button:hover:not(:disabled){background:rgba(108,195,255,.3)}button:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--w)}
#stars{position:absolute;inset:0}
#title{position:absolute;top:14%;width:100%;text-align:center;pointer-events:none}
#title h1 img{width:min(560px,84vw);filter:drop-shadow(0 0 18px #0a3d91)}
#title p{color:var(--l);letter-spacing:.2em;font-size:.9rem}
#menu{position:absolute;bottom:22%;width:100%;display:flex;flex-direction:column;align-items:center;gap:.8rem}
#menu button{width:230px;letter-spacing:.2em}
#by{position:absolute;right:14px;bottom:10px;font-size:.7rem;opacity:.7}
#tip{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:340px;background:rgba(5,15,35,.93);border:1px solid var(--l);padding:1rem;font-size:.9rem;display:none;line-height:1.4}
#tip b{color:var(--l)}
/* VN */
#vn{background:radial-gradient(ellipse at 50% 0,#17335c,#050b18 70%)}
#vn .win{position:absolute;top:8%;left:10%;right:10%;height:34%;border:1px solid #2a5a94;background:linear-gradient(#0b2a52,#030a16);opacity:.7}
.ch{position:absolute;bottom:0;height:78%;width:min(44vw,380px);transition:.3s;filter:brightness(.45)}
.ch.act{filter:none;transform:translateY(-6px)}#chL{left:3%}#chR{right:3%}
.ch svg{height:100%;width:100%}
#box{position:absolute;left:4%;right:4%;bottom:3%;min-height:26%;background:rgba(3,10,25,.92);border:1px solid var(--l);padding:1.1rem 1.4rem;cursor:pointer;z-index:5}
#nm{position:absolute;top:-1.1em;left:1.2rem;background:var(--l);color:#02101f;padding:.1em 1em;font-weight:700}
#tx{line-height:1.5;font-size:clamp(.9rem,2.4vw,1.1rem);white-space:pre-line}
#nx{position:absolute;right:1rem;bottom:.4rem;color:var(--l);animation:bl 1s infinite}@keyframes bl{50%{opacity:0}}
#vnbg{position:absolute;inset:0;background-size:cover;background-position:center 15%;transition:.3s}#vnbg.blur{filter:blur(6px) brightness(.4)}#chR.act{right:calc(50% - 190px)}
/* HUD */
#hud{position:absolute;top:0;left:0;right:0;display:flex;flex-wrap:wrap;gap:.4rem 1rem;padding:.6rem 1rem;background:rgba(5,14,30,.92);border-bottom:1px solid #1d4a7d;font-size:.8rem;z-index:3;align-items:center}
#hud button{padding:.3em .7em;font-size:.8rem}#hud .d{font-weight:700;color:var(--l);font-size:1rem;margin-right:auto}
.main{position:absolute;top:56px;bottom:0;left:0;right:0;overflow:auto}
.arr{position:absolute;top:50%;z-index:4;font-size:1.6rem;padding:.6em .5em;transform:translateY(-50%)}#aL{left:4px}#aR{right:4px}
#map{position:absolute;inset:0 0 0 0;background:radial-gradient(circle at 5% 50%,#2a1a05 0,#02050d 35%)}
.pl{position:absolute;transform:translate(-50%,-50%);text-align:center;cursor:pointer;font-size:.7rem}
.pl i{display:block;margin:auto;border-radius:50%;box-shadow:inset -6px -6px 12px rgba(0,0,0,.6)}
.pl.lock{filter:grayscale(1) brightness(.4);cursor:not-allowed}
.pl em{position:absolute;top:-1.5em;left:0;right:0;color:var(--o);font-style:normal;font-weight:700;font-size:1.1rem;animation:bl 1.2s infinite}
.pl.sel i{outline:2px solid var(--l);outline-offset:4px}
.panel{position:absolute;right:48px;bottom:12px;width:min(340px,calc(100% - 100px));background:rgba(4,14,32,.95);border:1px solid var(--l);padding:1rem;font-size:.85rem;line-height:1.4;z-index:3;max-height:75%;overflow:auto}
.panel h3{color:var(--l);margin-bottom:.3rem}.panel button{margin:.5rem .4rem 0 0;padding:.5em 1em}
#ship{display:flex;flex-wrap:wrap;gap:1rem;padding:1rem 3.2rem;justify-content:center;align-items:flex-start}
#ship svg{width:min(560px,100%);flex:1 1 360px}
.sec{cursor:pointer;stroke:#cfe9ff;stroke-width:2;transition:.2s}.sec:hover{filter:brightness(1.3)}
#ship .panel{position:static;flex:1 1 280px;width:auto}
.pill{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:.4em}
.g{background:var(--g)}.y{background:var(--y)}.r{background:var(--r);animation:bl 1s infinite}
.ovl{position:fixed;inset:0;background:rgba(1,4,10,.96);z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:.7rem;padding:1rem;text-align:center}
.ovl.on{display:flex}.ovl canvas{max-width:100%;border:1px solid var(--l);background:#02060f;touch-action:none}
.cards{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center}.cards button{width:min(300px,90vw);padding:1.2em;line-height:1.4}
.bar{height:6px;background:#12304f;margin:2px 0 6px}.bar span{display:block;height:100%;background:var(--l)}
.pt{width:100%;height:100%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 4px 10px #000)}#inv{flex-basis:100%;display:flex;gap:.4rem;overflow-x:auto}#inv button{padding:.25em .6em;font-size:.72rem;white-space:nowrap;background:rgba(10,40,80,.6)}#inv b{color:var(--l);margin-left:.3em}#mw{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(400px,92vw);max-height:80vh;overflow:auto;background:rgba(4,14,32,.97);border:1px solid var(--l);padding:1rem;z-index:40;font-size:.85rem;line-height:1.4;box-shadow:0 0 30px #000}#mw.on{display:block}#mw h3{color:var(--w);margin-bottom:.4rem}.hl{border-color:#fff;animation:gl 1s infinite}@keyframes gl{50%{box-shadow:0 0 14px var(--l)}}#rec{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.3rem;font-size:.8rem}#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:var(--o);color:#1a0a00;padding:.6em 1.2em;font-weight:700;z-index:30;display:none}
</style></head><body>

<div class="scr on" id="s-title"><canvas id="stars"></canvas>
<div id="title"><h1><img id="logo" alt="SPATIUM"></h1><p>Toca una constelación</p></div>
<div id="tip"></div>
<div id="menu"><button id="bStart">INICIO</button><button id="bCfg">CONFIGURACIÓN</button><button id="bExit">SALIR</button></div>
<div id="by">By Los Jedi de la NASA</div><div style="position:absolute;left:14px;bottom:10px;font-size:.7rem;opacity:.5">v5 · retratos PNG</div></div>

<div class="scr" id="s-vn">
<div id="vn" style="position:absolute;inset:0"><div id="vnbg"></div><div class="ch" id="chL"></div><div class="ch" id="chR"></div>
<div id="box"><div id="nm"></div><div id="tx"></div><div id="nx">▼</div></div></div></div>

<div class="scr" id="s-game">
<div id="hud"></div>
<div class="main">
 <div id="map"></div>
 <div id="ship" style="display:none"></div>
</div>
<button class="arr" id="aL">◀</button><button class="arr" id="aR">▶</button>
</div>

<div class="ovl" id="ov"></div><div id="mw"></div><div id="toast"></div>

function pickEvent(){let pool=EV.filter(e=>!(S.seen||[]).includes(e.id));if(!pool.length){S.seen=[];pool=EV}const e=pool[Math.random()*pool.length|0];S.seen=[...(S.seen||[]),e.id];return e}
function runEvent(o,n){const e=o.ev,w=['Al llegar','Durante la recolección','En el regreso'][Math.random()*3|0];
 ov(`<h2>⚠ Evento: ${e.n}</h2><p><i>${w} · ${o.c.name} · ${o.p.n}</i></p><p style="max-width:440px">${e.t}</p><p>Dificultad: ${'★'.repeat(e.df)}${'☆'.repeat(3-e.df)}</p><button class="hl" id="go">Enfrentar</button>`);
 $('#go').onclick=()=>{CUR={ev:true,n:e.n,df:e.df,cb:win=>result(o,win,n)};ov();(e.g==='tim'?timing:simon)()}}
function result(o,win,n){const e=o.ev,x=win?e.win:e.lose,m=[],p=o.p;
 if(x.h){const k=p.mats[x.h>0?Math.random()*p.mats.length|0:0][0],old=S.inv[k]||0;S.inv[k]=Math.max(0,old+x.h);m.push((S.inv[k]-old>0?'+':'')+(S.inv[k]-old)+' '+MN[k])}
 if(x.f){S.res.fuel=Math.max(0,S.res.fuel+x.f);m.push(x.f+' combustible')}
 if(x.$){S.res.money+=x.$;m.push('+$'+x.$)}
 if(x.hurt){o.c.av=false;o.c.back=S.day+1;m.push(o.c.name+' vuelve mañana')}
 S.log.push(e.n+': '+(win?'superado':'fallido'));save();render();
 ov(`<h2>${win?'✔ Evento superado':'✖ Evento fallido'}</h2><p>${x.m}</p><p>${m.join(' · ')||'Sin cambios'}</p><button id="ok">Continuar</button>`);$('#ok').onclick=()=>{ov();n()}}
function damageAlert(nx){const f=S.faults.filter(x=>!x.done);if(!f.length)return nx();
 ov(`<h2>⚠ Daños detectados</h2><p style="max-width:440px;text-align:left">${f.map(x=>'• <b>'+SEC[x.k].n+'</b>: '+x.t).join('<br>')}</p><p>Cada reparación cuesta 1 material de reparación.</p><button id="ok">Cerrar</button>`);$('#ok').onclick=()=>{ov();nx()}}

/* ===== FLUJO ===== */
function newGame(){S=NEW();save();say(INTRO,startDay)}
function enterGame(){show('game');render()}
function resolveExps(){const out=[],keep=[];S.exps.forEach(e=>{if(e.ret>S.day){keep.push(e);return}const p=PL.find(q=>q.id===e.dest);e.who.forEach(id=>{const c=S.crew.find(q=>q.id===id);c.av=true;if(Math.random()<.6)EVQ.push({ev:pickEvent(),c,p})});
 if(Math.random()*100<e.p){const g=p.mats.map(([k,a,b])=>{const n=a+Math.floor(Math.random()*(b-a+1));S.inv[k]=(S.inv[k]||0)+n;return n+' '+MN[k]}).join(', ');out.push(`✔ ${p.n}: éxito. Trajeron ${g}.`)}
 else{const k=p.mats[0][0];S.inv[k]=(S.inv[k]||0)+1;out.push(`✖ ${p.n}: contratiempos. Solo 1 ${MN[k]}.`)}});S.exps=keep;return out}
function startDay(){const D=DAYS[S.day];EVQ=[];const msgs=resolveExps();
 S.crew.forEach(c=>{if(c.back&&c.back<=S.day){c.av=true;c.back=0}});S.encDone=false;
 const keep=S.faults.filter(f=>!f.done),free=Object.keys(SEC).filter(k=>!keep.some(f=>f.k===k)).sort(()=>Math.random()-.5),n=keep.length>=2?1:1+(Math.random()<.5?1:0);
 S.faults=[...keep,...free.slice(0,n).map(mkFault)];S.pending=S.faults.length;S.pi=100-20*keep.length;
 Object.keys(SEC).forEach(k=>S.sec[k]='g');S.faults.forEach(f=>S.sec[f.k]='r');
 Q=[];if(msgs.length)Q.push(nx=>{ov(`<h2>Regresaron las expediciones</h2><p>${msgs.join('<br>')}</p><button id="ok">Continuar</button>`);$('#ok').onclick=()=>{ov();nx()}});
 EVQ.forEach(o=>Q.push(nx=>runEvent(o,nx)));Q.push(nx=>damageAlert(nx));if(S.day>=2&&Math.random()<.2)Q.push(nx=>trader(nx));
 save();say(D.mon,()=>{show('game');S.panel=1;render();runQ()})}
function render(){const r=S.res;
 $('#hud').innerHTML=`<span class="d">DÍA ${S.day}/5</span><span>⛽ ${r.fuel}</span><span>💧 ${r.water}</span><span>⚡ ${r.power}</span><span>💰 $${r.money}</span><button id="hP">🖨 Impresora 3D</button><button id="hC">👥 Tripulación</button><button id="hE" class="${S.pending===0?'hl':''}">⏭ Terminar día</button><div id="inv">${MATS.map(k=>`<button data-m="${k}">${ICON[k]} ${NAME[k]} <b>${qty(k)}</b></button>`).join('')}</div>`;
 $('#hP').onclick=printer;$('#hC').onclick=crewScr;$('#hE').onclick=endDay;document.querySelectorAll('#inv button').forEach(b=>b.onclick=()=>matInfo(b.dataset.m));
 {const h=$('#hud').offsetHeight;if(h>0)$('.main').style.top=h+'px'}
 $('#map').style.display=S.panel==0?'block':'none';$('#ship').style.display=S.panel==1?'flex':'none';

 if(S.panel==0)drawMap();else drawShip();save()}

function drawMap(){const m=$('#map');
 m.innerHTML=`<div style="position:absolute;left:-40px;top:50%;width:120px;height:120px;margin-top:-60px;border-radius:50%;background:radial-gradient(#fff3b0,#f5a623 50%,transparent 70%)"></div>`+PL.map(p=>`<div class="pl ${p.lk?'lock':''} ${selP==p.id?'sel':''}" data-id="${p.id}" style="left:${p.x}%;top:${p.y}%">${p.m&&!p.lk&&S.day>=p.d&&!(S.vis||[]).includes(p.id)?`<em>${'!'.repeat(p.u)}</em>`:''}<i style="width:${p.s}px;height:${p.s}px;background:radial-gradient(circle at 30% 30%,${p.c},#111)"></i>${p.n}${p.lk?' 🔒':''}</div>`).join('')+'<div id="pn"></div>';
 m.querySelectorAll('.pl').forEach(e=>e.onclick=()=>{const p=PL.find(q=>q.id==e.dataset.id);if(p.lk){toast(p.n+' está bloqueado');return}selP=p.id;drawMap();info(p)})}

 const t=$('#trv');if(t)t.onclick=()=>expedScreen(p);$('#ex').onclick=()=>{selP=null;drawMap()}}
function drawShip(){const sel=S.selS;

 $('#ship').innerHTML=`<svg viewBox="0 0 560 220"><path d="M5 110L20 60Q80 30 270 28L440 40Q520 60 548 110Q520 160 440 180L270 192Q80 190 20 160Z" fill="#0b1b33" stroke="#6cc3ff" stroke-width="3"/>${parts}</svg><div class="panel" id="sp">${sel?secInfo(sel):'<h3>Sistemas de la nave</h3><p>Seleccioná un sector para ver su estado.</p><p><span class="pill g"></span>Normal <span class="pill r"></span>Falla crítica</p>'}</div>`;
 $('#ship').querySelectorAll('.sec').forEach(e=>e.onclick=()=>{S.selS=e.dataset.k;drawShip()});
 const b=$('#rep');if(b)b.onclick=()=>startRepair(S.selS)}
function secInfo(k){const s=SEC[k],f=S.faults.find(x=>x.k===k&&!x.done);
 return `<h3><span class="pill ${f?'r':'g'}"></span>${s.n}</h3><p>${s.d}</p><p><b>Estado:</b> ${f?'Falla crítica':'Normal'}</p>${f?`<p><b>Problema:</b> ${f.t}</p><button id="rep">Iniciar reparación (1 material)</button>`:'<p>Sin problemas actuales.</p>'}<p style="opacity:.75;margin-top:.5rem">💡 ${s.f}</p>`}

function factHtml(){return CUR&&CUR.fact?`<p style="max-width:440px;font-size:.85rem">💡 ${CUR.fact}</p>`:''}
function fixDone(k){const f=S.faults.find(x=>x.k===k&&!x.done);if(f){S.pi=integ();f.done=1;S.pending--;S.res.mat=Math.max(0,S.res.mat-1)}S.sec[k]='g';S.log.push('Reparado: '+SEC[k].n);save()}
function startRepair(k){const f=S.faults.find(x=>x.k===k&&!x.done);if(!f)return;CUR=f;
 if(S.res.mat<1){toast('Cada reparación cuesta 1 material: fabricá un kit en la impresora 3D o intercambiá con Cosmo');return}
 say(f.d,()=>{show('game');({arc:()=>arcade(f.lv),patch:patches,tim:timing,sim:simon})[f.g]()})}
function after(){render();const a=S.pi,b=integ();
 ov(`<h2>🔧 Reparando...</h2><div style="width:min(320px,80vw)"><div class="bar" style="height:12px"><span id="ib" style="width:${a}%;transition:width 1.6s;background:var(--g)"></span></div></div><p id="it">Integridad ${a}%</p>`);
 setTimeout(()=>{const x=$('#ib');if(x){x.style.width=b+'%';$('#it').textContent='Integridad '+b+'%'}},150);
 setTimeout(()=>{ov();if(S.pending>0){toast('Sector reparado');return}const e=DAYS[S.day].enc;if(e&&!S.encDone){S.encDone=true;save();setTimeout(()=>say(e.t,()=>signal(e.c)),300)}else toast('Nave reparada. Planificá expediciones o terminá el día')},2100)}
function mgEnd(w,okT,failT,retry){const st=$('#st');if(w){if(!CUR.ev)fixDone(CUR.k);st.innerHTML=`<h3>${okT} ✔</h3>`+factHtml()+'<button id="ok">Continuar</button>';$('#ok').onclick=()=>{ov();CUR.ev?CUR.cb(true):after()}}else{st.innerHTML=`<h3>${failT} ✖</h3><button id="rt">${CUR.ev?'Continuar':'Reintentar'}</button>`;$('#rt').onclick=()=>{if(CUR.ev){ov();CUR.cb(false)}else retry()}}}
function timing(){ov(`<h2>${CUR.n}</h2><p>Detené el indicador dentro de la zona verde 3 veces. Tocá el botón o Espacio.</p><canvas id="c" width="480" height="120"></canvas><div id="st">Aciertos 0/3 · Errores 0/3</div><button id="go">Detener</button>`);
 const g=$('#c').getContext('2d');let x=0,v=3+2*(CUR.df||1.3),hits=0,miss=0,run=true,z=200;const W=100-15*(CUR.df||1.3);
 const end=w=>{run=false;removeEventListener('keydown',kd);$('#go').style.display='none';mgEnd(w,'Calibración correcta','Calibración fallida',timing)};
 const hit=()=>{if(!run)return;if(x>=z&&x<=z+W){hits++;v+=1.5;z=30+Math.random()*380}else miss++;$('#st').textContent=`Aciertos ${hits}/3 · Errores ${miss}/3`;if(hits>=3)end(true);else if(miss>=3)end(false)};
 const kd=e=>{if(e.key===' '){e.preventDefault();hit()}};addEventListener('keydown',kd);$('#go').onclick=hit;
 (function loop(){if(!run)return;x+=v;if(x>480||x<0){v=-v;x=Math.max(0,Math.min(480,x))}g.fillStyle='#02060f';g.fillRect(0,0,480,120);g.fillStyle='#1c3556';g.fillRect(0,40,480,40);g.fillStyle='#2f9d62';g.fillRect(z,40,W,40);g.fillStyle='#fff';g.fillRect(x-3,30,6,60);requestAnimationFrame(loop)})()}
function simon(){const cols=['#c2403d','#2f9d62','#2f6fc2','#c9a227'];const seq=Array.from({length:3+(CUR.df||2)},()=>Math.random()*4|0);let n=0,inp=[],busy=true;
 ov(`<h2>${CUR.n}</h2><p>Memorizá la secuencia de válvulas y repetila.</p><div id="pads" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;width:240px">${cols.map((c,i)=>`<button data-i="${i}" style="background:${c};height:90px;opacity:.45"></button>`).join('')}</div><div id="st">Mirá...</div>`);
 const pads=[...document.querySelectorAll('#pads button')],wait=t=>new Promise(r=>setTimeout(r,t));
 const flash=async i=>{pads[i].style.opacity=1;await wait(350);pads[i].style.opacity=.45;await wait(180)};
 async function play(){busy=true;$('#st').textContent=`Nivel ${n+1}/${seq.length}: mirá...`;await wait(500);for(let j=0;j<=n;j++)await flash(seq[j]);inp=[];busy=false;$('#st').textContent='Tu turno'}
 pads.forEach(p=>p.onclick=async()=>{if(busy)return;const i=+p.dataset.i;inp.push(i);flash(i);
  if(i!==seq[inp.length-1]){busy=true;mgEnd(false,'','Secuencia incorrecta',simon);return}
  if(inp.length===n+1){n++;if(n===seq.length){busy=true;mgEnd(true,'Sistema reactivado','',simon)}else play()}});
 play()}

function endDay(){const e=DAYS[S.day].enc;if(e&&!S.encDone){S.encDone=true;save();return say(e.t,()=>signal(e.c))}

 if(S.pending>0){ov(`<h2>Fallas sin reparar</h2><p style="max-width:420px">Cada falla sin reparar consume 4 de electricidad y 3 de agua extra, y seguirá mañana.</p><div class="cards"><button id="a">Terminar el día igual</button><button id="b">Volver</button></div>`);$('#a').onclick=()=>{ov();go()};$('#b').onclick=()=>ov();return}
 go()}
function report(){show('game');const r=S.res;const pen=S.faults.filter(f=>!f.done).length;r.water-=5+2*S.crew.length+3*pen;r.power-=6+4*pen;if(S.sec.pow==='g')r.power+=10;r.power=Math.min(100,r.power);
 const log=S.log.length?S.log.map(l=>'• '+l).join('<br>'):'• Día tranquilo';S.log=[];save();
 ov(`<h2>Informe del Día ${S.day}</h2><p style="text-align:left;max-width:440px">${log}</p><p>Consumo diario: agua −${5+2*S.crew.length}, electricidad −6${pen?'<br>Fallas sin reparar ('+pen+'): agua −'+3*pen+', electricidad −'+4*pen:''}<br>⛽ ${r.fuel} · 💧 ${r.water} · ⚡ ${r.power} · 🔧 ${r.mat}</p><button id="nd">${S.day>=5?'Ver el final':'Pasar al Día '+(S.day+1)}</button>`);
 $('#nd').onclick=()=>{ov();if(r.water<=0||r.power<=0){S.over='defeat';save();return ending(0)}loading(()=>{if(S.day>=5)ending(S.mods.length);else{S.day++;startDay()}})}}
function ending(m){const t=S.over&&m===0?['Misión fallida','Te quedaste sin recursos vitales. La NASA perdió contacto con la nave.']:['Terminó la fase demo','Completaste los 5 días de la fase demo de SPATIUM. ¡Gracias por jugar!'];
 ov(`<h2>${t[0]}</h2><p style="max-width:440px">${t[1]}</p><button id="rs">Jugar de nuevo</button>`);$('#rs').onclick=()=>{localStorage.removeItem('spatium');location.reload()}}

/* ===== MINIJUEGOS ===== */
function arcade(lv=1){ov(`<h2>Defensa del sistema de comando</h2><p>← → o deslizá para mover · Espacio o toque para disparar</p><canvas id="c" width="480" height="360"></canvas><div id="st"></div>`);
 const c=$('#c'),g=c.getContext('2d');let px=240,bl=[],en=[],life=3,run=true,dir=1,tick=0,last=0,keys={};const TOT=12+lv*6;
 for(let i=0;i<TOT;i++)en.push({x:50+(i%6)*70,y:30+Math.floor(i/6)*40,a:1,t:['VIRUS','BOT','TROYANO'][i%3]});
 const fire=()=>{if(performance.now()-last>220){bl.push({x:px,y:320});last=performance.now()}};
 const kd=e=>{keys[e.key]=1;if(e.key===' '){e.preventDefault();fire()}},ku=e=>keys[e.key]=0;addEventListener('keydown',kd);addEventListener('keyup',ku);
 c.onpointermove=e=>{px=(e.clientX-c.getBoundingClientRect().left)*480/c.clientWidth};c.onpointerdown=e=>{c.onpointermove(e);fire()};

  if(w){fixDone('cmd');S.res.money+=200;$('#st').innerHTML='<h3>Sistema restaurado ✔</h3>'+factHtml()+'<button id="ok">Continuar</button>';$('#ok').onclick=()=>{ov();after()}}
  else $('#st').innerHTML='<h3>Intrusión exitosa ✖</h3><button id="rt">Reintentar</button>',$('#rt').onclick=()=>arcade(lv)};
 (function loop(){if(!run)return;tick++;if(keys.ArrowLeft||keys.a)px-=5;if(keys.ArrowRight||keys.d)px+=5;px=Math.max(20,Math.min(460,px));
  const alive=en.filter(e=>e.a);let edge=alive.some(e=>e.x>450&&dir>0||e.x<30&&dir<0);alive.forEach(e=>{e.x+=dir*(.5+lv*.15+(TOT-alive.length)*.03);if(edge)e.y+=12});if(edge)dir*=-1;
  bl.forEach(b=>b.y-=7);bl=bl.filter(b=>b.y>0);
  bl.forEach(b=>alive.forEach(e=>{if(e.a&&Math.abs(b.x-e.x)<18&&Math.abs(b.y-e.y)<14){e.a=0;b.y=-9}}));
  alive.forEach(e=>{if(e.a&&e.y>330){e.a=0;life--}});
  g.fillStyle='#02060f';g.fillRect(0,0,480,360);g.strokeStyle='#123';for(let i=0;i<480;i+=40){g.beginPath();g.moveTo(i,0);g.lineTo(i,360);g.stroke()}
  en.forEach(e=>{if(!e.a)return;g.fillStyle='#ff6b4d';g.fillRect(e.x-14,e.y-9,28,18);g.fillStyle='#000';g.fillRect(e.x-8,e.y-3,5,5);g.fillRect(e.x+3,e.y-3,5,5);g.fillStyle='#fff';g.font='8px monospace';g.textAlign='center';g.fillText(e.t,e.x,e.y+16)});
  g.fillStyle='#6cc3ff';bl.forEach(b=>g.fillRect(b.x-2,b.y,4,10));g.beginPath();g.moveTo(px,318);g.lineTo(px-16,346);g.lineTo(px+16,346);g.closePath();g.fill();
  g.fillStyle='#fff';g.textAlign='left';g.font='12px monospace';g.fillText('Integridad: '+'♥'.repeat(Math.max(life,0))+'  Amenazas: '+en.filter(e=>e.a).length,8,355);
  if(!en.some(e=>e.a))return end(true);if(life<=0)return end(false);requestAnimationFrame(loop)})()}
function patches(){ov(`<h2>Refrigeración de baterías</h2><p>Arrastrá cada parche a una perforación antes de perder todo el líquido.</p><canvas id="c" width="480" height="340"></canvas><div id="st"></div>`);
 const c=$('#c'),g=c.getContext('2d');const H=[{x:90,y:110},{x:200,y:150},{x:300,y:100},{x:400,y:160},{x:150,y:190}].map(h=>({...h,ok:0}));
 const P=H.map((_,i)=>({x:60+i*90,y:295,h:0,d:0}));let lvl=100,run=true,drag=null,drops=[],sealed=0;
 const pos=e=>{const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*480/r.width,y:(e.clientY-r.top)*340/r.height}};
 c.onpointerdown=e=>{const m=pos(e);drag=P.find(p=>!p.h&&Math.hypot(p.x-m.x,p.y-m.y)<24)||null};
 c.onpointermove=e=>{if(drag){const m=pos(e);drag.x=m.x;drag.y=m.y}};
 c.onpointerup=()=>{if(!drag)return;const t=H.find(h=>!h.ok&&Math.hypot(h.x-drag.x,h.y-drag.y)<28);if(t){t.ok=1;drag.h=1;drag.x=t.x;drag.y=t.y;sealed++}else{const i=P.indexOf(drag);drag.x=60+i*90;drag.y=295}drag=null};
 const end=w=>{run=false;if(w){fixDone(CUR.k);S.res.power=Math.min(100,S.res.power+10);$('#st').innerHTML='<h3>Todas las fugas selladas ✔</h3>'+factHtml()+'<button id="ok">Continuar</button>';$('#ok').onclick=()=>{ov();after()}}
  else $('#st').innerHTML='<h3>Se perdió el líquido ✖</h3><button id="rt">Reintentar</button>',$('#rt').onclick=patches};
 (function loop(){if(!run)return;lvl-=.07*(H.length-sealed);
  g.fillStyle='#02060f';g.fillRect(0,0,480,340);g.fillStyle='#1c3556';g.fillRect(0,80,480,150);g.fillStyle='#294a78';g.fillRect(0,95,480,120);
  g.fillStyle='rgba(80,200,255,.6)';g.fillRect(0,215-1.2*lvl,480,1.2*lvl);
  H.forEach(h=>{if(!h.ok){g.fillStyle='#000';g.beginPath();g.arc(h.x,h.y,12,0,7);g.fill();if(Math.random()<.4)drops.push({x:h.x,y:h.y+10,v:1})}});
  drops.forEach(d=>{d.y+=d.v;d.v+=.2;g.fillStyle='#6cd1ff';g.fillRect(d.x,d.y,3,6)});drops=drops.filter(d=>d.y<340);
  P.forEach(p=>{g.fillStyle=p.h?'#9bb':'#e0e6ef';g.fillRect(p.x-14,p.y-10,28,20);g.strokeStyle='#355';g.strokeRect(p.x-14,p.y-10,28,20)});
  g.fillStyle='#fff';g.font='12px monospace';g.fillText('Líquido: '+Math.max(0,Math.round(lvl))+'%   Fugas: '+(H.length-sealed),8,16);
  if(sealed==H.length)return end(true);if(lvl<=0)return end(false);requestAnimationFrame(loop)})()}

</script></body></html>
